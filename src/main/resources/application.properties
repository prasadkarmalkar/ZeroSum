spring.application.name=zerosum
spring.datasource.url=jdbc:postgresql://localhost:5432/zerosum

# Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

#Database properties
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Expose only the health endpoint over HTTP
management.endpoints.web.exposure.include=health

spring.mvc.problemdetails.enabled=true

# Custom JWT settings
jwt.issuer=zerosum
jwt.access-token-ttl=15m
jwt.private-key=classpath:certs/private.pem
jwt.public-key=classpath:certs/public.pem
