spring.application.name=zerosum

# Database (see README "Run it locally"); the password always comes from the environment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zerosum}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates the schema; there are no migrations yet (see README "Known trade-offs")
spring.jpa.hibernate.ddl-auto=update

# Fail fast instead of hanging when a row lock is held too long (Postgres lock_timeout, per connection)
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# Expose only the health endpoint over HTTP
management.endpoints.web.exposure.include=health

spring.mvc.problemdetails.enabled=true

# JWT access tokens, signed with RS256. The key pair lives outside the source tree (keys/ is gitignored),
# so the private key is never committed or packaged into the jar.
jwt.issuer=zerosum
jwt.access-token-ttl=1h
jwt.private-key=${JWT_PRIVATE_KEY:file:keys/private.pem}
jwt.public-key=${JWT_PUBLIC_KEY:file:keys/public.pem}

# The single currency every account uses (ISO 4217 code)
zerosum.currency=INR

# Seed an admin user on startup. For local development only: in production, set ZEROSUM_ADMIN_ENABLED=false
# or provide real credentials through the environment.
zerosum.admin.enabled=${ZEROSUM_ADMIN_ENABLED:true}
zerosum.admin.email=${ADMIN_EMAIL:admin@zerosum.local}
zerosum.admin.password=${ADMIN_PASSWORD:admin-dev-Passw0rd}
