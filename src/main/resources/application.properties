spring.application.name=zerosum
spring.datasource.url=jdbc:postgresql://localhost:5432/zerosum

# Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

#Database properties
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Expose only the health endpoint over HTTP
management.endpoints.web.exposure.include=health

spring.mvc.problemdetails.enabled=true

# Custom JWT settings
jwt.issuer=zerosum
jwt.access-token-ttl=1h
jwt.private-key=classpath:certs/private.pem
jwt.public-key=classpath:certs/public.pem

# The single currency every account uses (ISO 4217 code)
zerosum.currency=INR

# Seed an admin user on startup (dev only; a production profile must turn this off or override the credentials)
zerosum.admin.enabled=true
zerosum.admin.email=admin@zerosum.local
zerosum.admin.password=${ADMIN_PASSWORD:admin-dev-Passw0rd}

# Fail fast instead of hanging when a row lock is held too long (Postgres lock_timeout, per connection)
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
