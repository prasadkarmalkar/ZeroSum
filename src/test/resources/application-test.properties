spring.datasource.url=jdbc:postgresql://localhost:5432/zerosum_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# No Flyway yet, so let Hibernate build a fresh schema for each test run
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only JWT key pair, committed on purpose: it signs nothing outside tests and is NOT a secret.
# Distinct file names so tests never fall back to the local, gitignored certs/private.pem.
jwt.private-key=classpath:test-keys/jwt-test-private.pem
jwt.public-key=classpath:test-keys/jwt-test-public.pem


# Seed a known admin for tests
zerosum.admin.enabled=true
zerosum.admin.email=admin@zerosum.test
zerosum.admin.password=admin-test-Passw0rd


# Shorter lock wait in tests, so the timeout test stays quick
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '2s'
