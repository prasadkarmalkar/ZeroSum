name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # The tests run against a real PostgreSQL, the same as locally (never an in-memory stand-in)
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zerosum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zerosum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The JWT key pair comes from src/test/resources/test-keys (committed, test-only); nothing else is needed
      - name: Run the full test suite
        run: ./mvnw -B -ntp verify
        env:
          DB_PASSWORD: postgres

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
